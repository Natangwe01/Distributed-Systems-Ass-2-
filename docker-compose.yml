x-common-env: &common-env
  DB_HOST: postgres
  DB_USER: postgres
  DB_PASS: postgres
  KAFKA_BOOTSTRAP: kafka:9092
  BAL_CONFIG_FILES: /app/Config.toml

x-depends: &depends
  postgres:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in order.created payment.completed payment.failed order.confirmed order.preparing order.ready order.cancelled delivery.assigned delivery.started delivery.completed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: customers
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9091:9091"

  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: restaurants
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9092:9092"

  order-service:
    build:
      context: ./services/order-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: orders
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9093:9093"

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: payments
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9094:9094"

  delivery-service:
    build:
      context: ./services/delivery-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: deliveries
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9095:9095"

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: notifications
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9096:9096"

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: ../../Dockerfile
    environment:
      <<: *common-env
      DB_NAME: admin
    depends_on: *depends
    volumes:
      - ./observability/Config.toml:/app/Config.toml:ro
    ports:
      - "9097:9097"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

  web:
    image: nginx:alpine
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - customer-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service
      - admin-service
    ports:
      - "8080:80"

volumes:
  pgdata:
